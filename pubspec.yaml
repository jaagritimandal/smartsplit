name: smart_split
description: "A frictionless local-first expense tracker for student groups."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^1.1.1
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  intl: ^0.18.0
  uuid: ^4.0.0
  shared_preferences: ^2.1.0
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  objectbox_generator: ^5.3.2
  

flutter:
  uses-material-design: true